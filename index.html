<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to BookMySku. A simpler way to keep your inventory, orders, and business moving together." />
    <title>BookMySku | Your business, in sync</title>

    <!-- Fonts — Inter (body) + Manrope (display headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent dark-mode flash: apply .dark before first paint -->
    <script>
      ;(function () {
        var t = localStorage.getItem('theme')
        if (
          t === 'dark' ||
          (!t && window.matchMedia('(prefers-color-scheme:dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
