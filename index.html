<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BookMySku brings your clients, contacts, and team together in a calmer workspace."
    />
    <title>BookMySku | Your business, in sync</title>

    <!-- Fonts — Inter (body) + Manrope (display headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Use the dark glass theme by default and apply saved choices before paint. -->
    <script>
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch {
          /* Storage may be unavailable. */
        }
        if (t !== 'light') {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
